# Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Kotlin/Native GC (M3-M13, user decision 2026-10-15): Kotlin 2.4 makes the concurrent mark-sweep (CMS) GC the
# default. Pinned to the parallel mark, concurrent sweep GC that Kotlin 2.3 used, so the toolchain upgrade
# changes no iOS runtime behaviour; switching to CMS is measured in a later step (CMP-10859).
kotlin.native.binary.gc=pmcs
